<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
  <title>2022 개정 수학과 교육과정 개념 그래프</title>
  <style>
    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #fff;
      color: #111827;
      font-family: "Open Sans Condensed", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
      letter-spacing: 0;
    }

    #cy {
      width: 100%;
      height: 100%;
      display: block;
      background: #fff;
    }

    .hud {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10;
      width: min(420px, calc(100vw - 24px));
      background: rgba(255, 255, 255, 0.88);
      border: 1px solid rgba(209, 213, 219, 0.82);
      box-shadow: 0 14px 32px rgba(15, 23, 42, 0.09);
      backdrop-filter: blur(8px);
      border-radius: 8px;
      padding: 10px;
    }

    .hud.compact {
      width: 34px;
      height: 34px;
      padding: 0;
      overflow: hidden;
      background: rgba(255, 255, 255, 0.48);
      border-color: rgba(209, 213, 219, 0.58);
      box-shadow: none;
      backdrop-filter: none;
    }

    .hud.compact .hud-body {
      display: none;
    }

    .hud.compact .hud-head > div {
      display: none;
    }

    .hud.compact .hud-head {
      display: block;
      width: 34px;
      height: 34px;
    }

    .hud-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    h1 {
      margin: 0;
      font-size: 17px;
      line-height: 1.25;
      font-weight: 700;
    }

    .meta {
      margin: 3px 0 0;
      color: #667085;
      font-size: 11px;
      line-height: 1.35;
    }

    button,
    input,
    select {
      font: inherit;
      letter-spacing: 0;
    }

    .icon-button,
    .plain-button {
      border: 1px solid #d1d5db;
      background: #fff;
      color: #111827;
      border-radius: 6px;
      cursor: pointer;
    }

    .icon-button {
      width: 28px;
      height: 28px;
      line-height: 24px;
      padding: 0;
      font-size: 15px;
    }

    .hud.compact .icon-button {
      width: 34px;
      height: 34px;
      border: 0;
      background: transparent;
      line-height: 30px;
    }

    .plain-button {
      min-height: 30px;
      padding: 5px 8px;
      font-size: 12px;
    }

    .hud-body {
      margin-top: 9px;
      display: grid;
      gap: 8px;
    }

    .controls {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 124px;
      gap: 7px;
    }

    input,
    select {
      width: 100%;
      min-width: 0;
      border: 1px solid #d1d5db;
      border-radius: 6px;
      background: #fff;
      color: #111827;
      height: 30px;
      padding: 4px 8px;
      font-size: 12px;
    }

    .button-row {
      display: grid;
      grid-template-columns: repeat(4, minmax(0, 1fr));
      gap: 6px;
    }

    .notice {
      color: #475467;
      font-size: 11px;
      line-height: 1.45;
    }

    .drawer {
      position: fixed;
      top: 12px;
      right: 12px;
      bottom: 12px;
      z-index: 12;
      width: min(520px, calc(100vw - 24px));
      background: rgba(255, 255, 255, 0.94);
      border: 1px solid rgba(209, 213, 219, 0.9);
      box-shadow: 0 18px 40px rgba(15, 23, 42, 0.16);
      backdrop-filter: blur(8px);
      border-radius: 8px;
      display: none;
      grid-template-rows: auto minmax(0, 1fr);
      overflow: hidden;
    }

    .drawer.open {
      display: grid;
    }

    .drawer-head {
      padding: 12px;
      border-bottom: 1px solid #e5e7eb;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .drawer-head strong {
      font-size: 15px;
    }

    .drawer-body {
      overflow: auto;
      padding: 12px;
      font-size: 12px;
      line-height: 1.55;
    }

    pre {
      margin: 0;
      white-space: pre-wrap;
      font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace;
      font-size: 11px;
      line-height: 1.5;
      color: #111827;
    }

    .selection {
      position: fixed;
      left: 12px;
      bottom: 12px;
      z-index: 11;
      width: min(420px, calc(100vw - 24px));
      max-height: 34vh;
      overflow: auto;
      display: none;
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(209, 213, 219, 0.9);
      border-radius: 8px;
      box-shadow: 0 14px 32px rgba(15, 23, 42, 0.09);
      padding: 10px;
      font-size: 12px;
      line-height: 1.45;
    }

    .selection.open {
      display: block;
    }

    .selection h2 {
      margin: 0 0 6px;
      font-size: 16px;
      line-height: 1.25;
    }

    .selection ul {
      margin: 4px 0 8px;
      padding-left: 17px;
    }

    .selection p {
      margin: 4px 0;
    }
  </style>

을 구별하여 말할 수 있다."},{"code":"2수03-07","text":"시계를 보고 시각을 ‘몇 시 몇 분’까지 읽을 수 있다."},{"code":"2수03-08","text":"1시간과 1분의 관계를 이해하고, 시간을 ‘시간’, ‘분’으로 표현할 수 있다."},{"code":"2수03-09","text":"실생활 문제 상황과 연결하여 1분, 1시간, 1일, 1주일, 1개월, 1년 사이의 관계를 이해한다."},{"code":"2수03-10","text":"길이 단위 1cm와 1m를 알고, 이를 이용하여 주변 사물의 길이를 측정할 수 있다."},{"code":"2수03-11","text":"1m와 1cm의 관계를 이해하고, 길이를 ‘몇 m 몇 cm’와 ‘몇 cm’로 표현할 수 있다."},{"code":"2수03-12","text":"여러 가지 물건의 길이를 어림하고, 길이에 대한 양감을 기른다."},{"code":"2수03-13","text":"실생활 문제 상황과 연결하여 길이의 덧셈과 뺄셈을 할 수 있다."},{"code":"2수04-01","text":"여러 가지 사물을 정해진 기준 또는 자신이 정한 기준으로 분류하여 개수를 세어 보고, 기준에 따른 결과를 말할 수 있다."},{"code":"2수04-02","text":"자료를 분류하여 표로 나타내고, 자료를 표로 나타내면 편리한 점을 말할 수 있다."},{"code":"2수04-03","text":"자료를 분류하여 ○, ×, / 등을 이용한 그래프로 나타내고, 자료를 그래프로 나타내면 편리한 점을 말할 수 있다."},{"code":"4수01-01","text":"큰 수의 필요성을 인식하면서 10000 이상의 큰 수에 대한 자릿값과 위치적 기수법을 이해하고, 수를 읽고 쓸 수 있다."},{"code":"4수01-02","text":"다섯 자리 이상의 수의 범위에서 수의 계열을 이해하고, 수의 크기를 비교하며 그 방법을 설명할 수 있다."},{"code":"4수01-03","text":"세 자리 수의 덧셈과 뺄셈의 계산 원리를 이해하고 그 계산을 할 수 있다."},{"code":"4수01-04","text":"곱하는 수가 한 자리 수 또는 두 자리 수인 곱셈의 계산 원리를 이해하고 그 계산을 할 수 있다."},{"code":"4수01-05","text":"나눗셈이 이루어지는 실생활 상황과 연결하여 나눗셈의 의미를 알고, 곱셈과 나눗셈의 관계를 이해한다."},{"code":"4수01-06","text":"나누는 수가 한 자리 수인 나눗셈의 계산 원리를 이해하고 그 계산을 할 수 있으며, 나눗셈에서 몫과 나머지의 의미를 안다."},{"code":"4수01-07","text":"나누는 수가 두 자리 수인 나눗셈의 계산 원리를 이해하고 그 계산을 할 수 있다."},{"code":"4수01-08","text":"자연수의 덧셈, 뺄셈, 곱셈, 나눗셈과 관련한 여러 가지 상황에서 어림셈을 할 수 있다."},{"code":"4수01-09","text":"양의 등분할을 통하여 분수의 필요성을 인식하고, 분수를 이해하고 읽고 쓸 수 있다."},{"code":"4수01-10","text":"단위분수, 진분수, 가분수, 대분수를 알고, 그 관계를 이해한다."},{"code":"4수01-11","text":"분모가 같은 분수끼리, 단위분수끼리 크기를 비교하고 그 방법을 설명할 수 있다."},{"code":"4수01-12","text":"분모가 10인 진분수와 연결하여 소수 한 자리 수를 이해하고 읽고 쓸 수 있다."},{"code":"4수01-13","text":"자릿값의 원리를 바탕으로 소수 두 자리 수와 소수 세 자리 수를 이해하고 읽고 쓸 수 있다."},{"code":"4수01-14","text":"소수의 크기를 비교하고 그 방법을 설명할 수 있다."},{"code":"4수01-15","text":"분모가 같은 분수의 덧셈과 뺄셈의 계산 원리를 이해하고 그 계산을 할 수 있다."},{"code":"4수01-16","text":"소수 두 자리 수의 범위에서 소수의 덧셈과 뺄셈의 계산 원리를 이해하고 그 계산을 할 수 있다."},{"code":"4수02-01","text":"다양한 변화 규칙을 찾아 설명하고, 그 규칙을 수나 식으로 나타낼 수 있다."},{"code":"4수02-02","text":"계산식의 배열에서 규칙을 찾고, 계산 결과를 추측할 수 있다."},{"code":"4수02-03","text":"등호를 사용하여 크기가 같은 두 양의 관계를 식으로 나타낼 수 있다."},{"code":"4수03-01","text":"직선, 선분, 반직선을 이해하고 구별할 수 있다."},{"code":"4수03-02","text":"각과 직각을 이해하고, 직각과 비교하는 활동을 통하여 예각과 둔각을 구별할 수 있다."},{"code":"4수03-03","text":"직선의 수직 관계와 평행 관계를 이해한다."},{"code":"4수03-04","text":"구체물이나 평면도형의 밀기, 뒤집기, 돌리기 활동을 통하여 그 변화를 이해한다."},{"code":"4수03-05","text":"평면에서 점의 이동에 대해 위치와 방향을 이용하여 설명할 수 있다."},{"code":"4수03-06","text":"원의 중심, 반지름, 지름을 이해하고, 그 성질을 안다."},{"code":"4수03-07","text":"컴퍼스를 이용하여 여러 가지 크기의 원을 그릴 수 있다."},{"code":"4수03-08","text":"여러 가지 모양의 삼각형에 대한 분류 활동을 통하여 이등변삼각형, 정삼각형을 이해하고, 그 성질을 탐구하고 설명할 수 있다."},{"code":"4수03-09","text":"여러 가지 모양의 삼각형에 대한 분류 활동을 통하여 직각삼각형, 예각삼각형, 둔각 삼각형을 이해한다."},{"code":"4수03-10","text":"여러 가지 모양의 사각형에 대한 분류 활동을 통하여 직사각형, 정사각형, 사다리꼴, 평행 사변형, 마름모를 이해하고, 그 성질을 탐구하고 설명할 수 있다."},{"code":"4수03-11","text":"다각형과 정다각형을 이해한다."},{"code":"4수03-12","text":"주어진 도형을 이용하여 여러 가지 모양을 만들거나 채우고 설명할 수 있다."},{"code":"4수03-13","text":"1분과 1초의 관계를 이해하고, 초 단위까지 시각을 읽을 수 있다."},{"code":"4수03-14","text":"실생활 문제 상황과 연결하여 초 단위까지의 시간의 덧셈과 뺄셈을 할 수 있다."},{"code":"4수03-15","text":"길이 단위 1mm와 1km를 알고, 이를 이용하여 길이를 측정하고 어림하며 수학의 유용성을 인식할 수 있다."},{"code":"4수03-16","text":"1cm와 1mm, 1km와 1m의 관계를 이해하고, 길이를 ‘몇 cm 몇 mm’와 ‘몇 mm’, ‘몇 km 몇 m’와 ‘몇 m’로 다양하게 표현할 수 있다."},{"code":"4수03-17","text":"들이 단위 1L와 1mL를 알고, 이를 이용하여 들이를 측정하고 어림하며 수학의 유용성을 인식할 수 있다."},{"code":"4수03-18","text":"1L와 1mL의 관계를 이해하고, 들이를 ‘몇 L 몇 mL’와 ‘몇 mL’로 표현할 수 있다."},{"code":"4수03-19","text":"실생활 문제 상황과 연결하여 들이의 덧셈과 뺄셈을 할 수 있다."},{"code":"4수03-20","text":"실생활에서 무게를 나타낼 때 사용하는 단위 1g과 1kg을 알고, 이를 이용하여 무게를 측정하고 어림하며 수학의 유용성을 인식할 수 있다."},{"code":"4수03-21","text":"1kg과 1g의 관계를 이해하고, 무게를 ‘몇 kg 몇 g’과 ‘몇 g’으로 표현할 수 있다."},{"code":"4수03-22","text":"실생활에서 무게를 나타낼 때 사용하는 단위 1t을 알고, 1t과 1kg의 관계를 이해한다."},{"code":"4수03-23","text":"실생활 문제 상황과 연결하여 무게의 덧셈과 뺄셈을 할 수 있다."},{"code":"4수03-24","text":"각의 크기의 단위인 1도(°)를 알고, 각도기를 이용하여 각의 크기를 측정하고 어림할 수 있다."},{"code":"4수03-25","text":"여러 가지 방법으로 삼각형과 사각형의 내각의 크기의 합을 추론하고, 자신의 추론 과정을 설명할 수 있다."},{"code":"4수04-01","text":"자료를 수집하여 그림그래프나 막대그래프로 나타내고 해석할 수 있다."},{"code":"4수04-02","text":"자료를 수집하여 꺾은선그래프로 나타내고 해석할 수 있다."},{"code":"4수04-03","text":"탐구 문제를 해결하기 위해 자료를 수집, 정리하여 막대그래프나 꺾은선그래프로 나타내고 해석할 수 있다."},{"code":"6수01-01","text":"덧셈, 뺄셈, 곱셈, 나눗셈의 혼합 계산에서 계산하는 순서를 알고, 혼합 계산을 할 수 있다."},{"code":"6수01-02","text":"실생활과 연결하여 이상, 이하, 초과, 미만의 의미와 쓰임을 알고, 이를 활용하여 수의 범위를 나타낼 수 있다."},{"code":"6수01-03","text":"어림값을 구하기 위한 방법으로 올림, 버림, 반올림의 의미와 필요성을 알고, 이를 실생활에 활용함으로써 수학의 유용성을 인식할 수 있다."},{"code":"6수01-04","text":"약수, 공약수, 최대공약수를 이해하고 구할 수 있다."},{"code":"6수01-05","text":"배수, 공배수, 최소공배수를 이해하고 구할 수 있다."},{"code":"6수01-06","text":"크기가 같은 분수를 만드는 방법을 이해하고, 분수를 약분, 통분할 수 있다."},{"code":"6수01-07","text":"분모가 다른 분수의 크기를 비교하고 그 방법을 설명할 수 있다."},{"code":"6수01-08","text":"분모가 다른 분수의 덧셈과 뺄셈의 계산 원리를 탐구하고 그 계산을 할 수 있다."},{"code":"6수01-09","text":"분수의 곱셈의 계산 원리를 탐구하고 그 계산을 할 수 있다."},{"code":"6수01-10","text":"‘(자연수) ÷ (자연수)’에서 나눗셈의 몫을 분수로 나타낼 수 있다."},{"code":"6수01-11","text":"분수의 나눗셈의 계산 원리를 탐구하고 그 계산을 할 수 있다."},{"code":"6수01-12","text":"분수와 소수의 관계를 이해하고 크기를 비교하며 그 방법을 설명할 수 있다."},{"code":"6수01-13","text":"소수의 곱셈의 계산 원리를 탐구하고 그 계산을 할 수 있다."},{"code":"6수01-14","text":"‘(자연수) ÷ (자연수)’에서 나눗셈의 몫을 소수로 나타낼 수 있다."},{"code":"6수01-15","text":"소수의 나눗셈의 계산 원리를 탐구하고 그 계산을 할 수 있다."},{"code":"6수02-01","text":"한 양이 변할 때 다른 양이 그에 종속하여 변하는 대응 관계를 나타낸 표에서 규칙을 찾아 설명하고, □, △ 등을 사용하여 식으로 나타낼 수 있다."},{"code":"6수02-02","text":"두 양의 크기를 비교하는 상황을 통해 비의 개념을 이해하고, 두 양의 관계를 비로 나타낼 수 있다."},{"code":"6수02-03","text":"비율을 이해하고, 비율을 분수, 소수, 백분율로 나타낼 수 있다."},{"code":"6수02-04","text":"비례식을 알고, 그 성질을 이해하며, 이를 활용하여 간단한 비례식을 풀 수 있다."},{"code":"6수02-05","text":"비례배분을 알고, 주어진 양을 비례배분 할 수 있다."},{"code":"6수03-01","text":"도형의 합동을 이해하고, 합동인 도형의 성질을 탐구하고 설명할 수 있다."},{"code":"6수03-02","text":"실생활과 연결하여 선대칭도형과 점대칭도형을 이해하고 그릴 수 있다."},{"code":"6수03-03","text":"직육면체와 정육면체를 이해하고, 구성 요소와 성질을 탐구하고 설명할 수 있다."},{"code":"6수03-04","text":"직육면체와 정육면체의 겨냥도와 전개도를 그릴 수 있다."},{"code":"6수03-05","text":"각기둥과 각뿔을 이해하고, 구성 요소와 성질을 탐구하고 설명할 수 있다."},{"code":"6수03-06","text":"각기둥의 전개도를 그릴 수 있다."},{"code":"6수03-07","text":"원기둥, 원뿔, 구를 이해하고, 구성 요소와 성질을 탐구하고 설명할 수 있다."},{"code":"6수03-08","text":"원기둥의 전개도를 그릴 수 있다."},{"code":"6수03-09","text":"쌓기나무로 만든 입체도형을 보고 사용된 쌓기나무의 개수를 구할 수 있다."},{"code":"6수03-10","text":"쌓기나무로 만든 입체도형의 위, 앞, 옆에서 본 모양을 표현할 수 있고, 이러한 표현을 보고 입체도형의 모양을 추측할 수 있다."},{"code":"6수03-11","text":"평면도형의 둘레를 이해하고, 기본적인 평면도형의 둘레를 구할 수 있다."},{"code":"6수03-12","text":"넓이 단위 1cm², 1m², 1km²를 알며, 그 관계를 이해한다."},{"code":"6수03-13","text":"직사각형과 정사각형의 넓이를 구하는 방법을 이해하고, 이를 구할 수 있다."},{"code":"6수03-14","text":"평행사변형, 삼각형, 사다리꼴, 마름모의 넓이를 구하는 방법을 다양하게 추론하고, 이와 관련된 문제를 해결할 수 있다."},{"code":"6수03-15","text":"여러 가지 원 모양 물체의 원주와 지름을 측정하는 활동을 통하여, 원주율이 일정한 값임을 알고 그 근삿값을 사용할 수 있다."},{"code":"6수03-16","text":"원주와 원의 넓이를 구하는 방법을 이해하고, 이를 구할 수 있다."},{"code":"6수03-17","text":"직육면체와 정육면체의 겉넓이를 구하는 방법을 이해하고, 이를 구할 수 있다."},{"code":"6수03-18","text":"부피 단위 1cm³, 1m³를 알며, 그 관계를 이해한다."},{"code":"6수03-19","text":"직육면체와 정육면체의 부피를 구하는 방법을 이해하고, 이를 구할 수 있다."},{"code":"6수04-01","text":"평균의 의미를 알고, 자료를 수집하여 평균을 구하고 해석할 수 있다."},{"code":"6수04-02","text":"자료를 수집하여 띠그래프나 원그래프로 나타내고 해석할 수 있다."},{"code":"6수04-03","text":"탐구 문제를 설정하고, 그에 맞는 자료를 수집, 정리하여 적절한 그래프로 나타내고 해석할 수 있다."},{"code":"6수04-04","text":"사건이 일어날 가능성을 말로 표현하고 비교할 수 있다."},{"code":"6수04-05","text":"사건이 일어날 가능성을 수로 나타낼 수 있다."},{"code":"6수04-06","text":"자료를 이용하여 가능성을 예상하고, 가능성에 근거하여 적절한 판단을 내릴 수 있다."},{"code":"9수01-01","text":"소인수분해의 뜻을 알고, 자연수를 소인수분해 할 수 있다."},{"code":"9수01-02","text":"소인수분해를 이용하여 최대공약수와 최소공배수를 구할 수 있다."},{"code":"9수01-03","text":"다양한 상황을 이용하여 음수의 필요성을 인식하고, 양수와 음수, 정수와 유리수의 개념을 이해한다."},{"code":"9수01-04","text":"정수와 유리수의 대소 관계를 판단할 수 있다."},{"code":"9수01-05","text":"정수와 유리수의 사칙계산의 원리를 이해하고, 그 계산을 할 수 있다."},{"code":"9수01-06","text":"순환소수의 뜻을 알고, 유리수와 순환소수의 관계를 설명할 수 있다."},{"code":"9수01-07","text":"제곱근의 뜻과 성질을 알고, 제곱근의 대소 관계를 판단할 수 있다."},{"code":"9수01-08","text":"무리수의 개념을 이해하고, 무리수의 유용성을 인식할 수 있다."},{"code":"9수01-09","text":"실수의 대소 관계를 판단하고 설명할 수 있다."},{"code":"9수01-10","text":"근호를 포함한 식의 사칙계산의 원리를 이해하고, 그 계산을 할 수 있다."},{"code":"9수02-01","text":"다양한 상황을 문자를 사용한 식으로 나타내어 그 유용성을 인식하고, 식의 값을 구할 수 있다."},{"code":"9수02-02","text":"일차식의 덧셈과 뺄셈의 원리를 이해하고, 그 계산을 할 수 있다."},{"code":"9수02-03","text":"방정식과 그 해의 뜻을 알고, 등식의 성질을 설명할 수 있다."},{"code":"9수02-04","text":"일차방정식을 풀 수 있고, 이를 활용하여 문제를 해결할 수 있다."},{"code":"9수02-05","text":"순서쌍과 좌표를 이해하고, 그 편리함을 인식할 수 있다."},{"code":"9수02-06","text":"다양한 상황을 그래프로 나타내고, 주어진 그래프를 해석할 수 있다."},{"code":"9수02-07","text":"정비례, 반비례 관계를 이해하고, 그 관계를 표, 식, 그래프로 나타낼 수 있다."},{"code":"9수02-08","text":"지수법칙을 이해하고, 이를 이용하여 식을 간단히 할 수 있다."},{"code":"9수02-09","text":"다항식의 덧셈과 뺄셈의 원리를 이해하고, 그 계산을 할 수 있다."},{"code":"9수02-10","text":"‘(단항식)× (다항식)’, ‘(다항식)÷ (단항식)’과 같은 곱셈과 나눗셈의 원리를 이해하고, 그 계산을 할 수 있다."},{"code":"9수02-11","text":"부등식과 그 해의 뜻을 알고, 부등식의 성질을 설명할 수 있다."},{"code":"9수02-12","text":"일차부등식을 풀 수 있고, 이를 활용하여 문제를 해결할 수 있다."},{"code":"9수02-13","text":"미지수가 2개인 연립일차방정식을 풀 수 있고, 이를 활용하여 문제를 해결할 수 있다."},{"code":"9수02-14","text":"함수의 개념을 이해하고, 함숫값을 구할 수 있다."},{"code":"9수02-15","text":"일차함수의 개념을 이해하고, 그 그래프를 그릴 수 있다."},{"code":"9수02-16","text":"일차함수의 그래프의 성질을 이해하고, 이를 활용하여 문제를 해결할 수 있다."},{"code":"9수02-17","text":"일차함수와 미지수가 2개인 일차방정식의 관계를 설명할 수 있다."},{"code":"9수02-18","text":"두 일차함수의 그래프와 연립일차방정식의 관계를 설명할 수 있다."},{"code":"9수02-19","text":"다항식의 곱셈과 인수분해를 할 수 있다."},{"code":"9수02-20","text":"이차방정식을 풀 수 있고, 이를 활용하여 문제를 해결할 수 있다."},{"code":"9수02-21","text":"이차함수의 개념을 이해한다."},{"code":"9수02-22","text":"이차함수의 그래프를 그릴 수 있고, 그 성질을 설명할 수 있다."},{"code":"9수03-01","text":"점, 선, 면, 각을 이해하고, 실생활 상황과 연결하여 점, 직선, 평면의 위치 관계를 설명할 수 있다."},{"code":"9수03-02","text":"평행선에서 동위각과 엇각의 성질을 이해하고 설명할 수 있다."},{"code":"9수03-03","text":"삼각형을 작도하고, 그 과정을 설명할 수 있다."},{"code":"9수03-04","text":"삼각형의 합동 조건을 이해하고, 이를 이용하여 두 삼각형이 합동인지 판별할 수 있다."},{"code":"9수03-05","text":"다각형의 성질을 이해하고 설명할 수 있다."},{"code":"9수03-06","text":"부채꼴의 중심각과 호의 관계를 이해하고, 이를 이용하여 부채꼴의 호의 길이와 넓이를 구할 수 있다."},{"code":"9수03-07","text":"구체적인 모형이나 공학 도구를 이용하여 다면체와 회전체의 성질을 탐구하고, 이를 설명할 수 있다."},{"code":"9수03-08","text":"입체도형의 겉넓이와 부피를 구할 수 있다."},{"code":"9수03-09","text":"이등변삼각형의 성질을 이해하고 정당화할 수 있다."},{"code":"9수03-10","text":"삼각형의 외심과 내심의 성질을 이해하고 정당화할 수 있다."},{"code":"9수03-11","text":"사각형의 성질을 이해하고 정당화할 수 있다."},{"code":"9수03-12","text":"도형의 닮음의 뜻과 닮은 도형의 성질을 이해하고, 닮음비를 구할 수 있다."},{"code":"9수03-13","text":"삼각형의 닮음 조건을 이해하고, 이를 이용하여 두 삼각형이 닮음인지 판별할 수 있다."},{"code":"9수03-14","text":"평행선 사이의 선분의 길이의 비를 구할 수 있다."},{"code":"9수03-15","text":"피타고라스 정리를 이해하고 정당화할 수 있다."},{"code":"9수03-16","text":"삼각비의 뜻을 알고, 간단한 삼각비의 값을 구할 수 있다."},{"code":"9수03-17","text":"삼각비를 활용하여 여러 가지 문제를 해결할 수 있다."},{"code":"9수03-18","text":"원의 현에 관한 성질과 접선에 관한 성질을 이해하고 정당화할 수 있다."},{"code":"9수03-19","text":"원주각의 성질을 이해하고 정당화할 수 있다."},{"code":"9수04-01","text":"중앙값, 최빈값의 뜻을 알고, 자료의 특성에 따라 적절한 대푯값을 선택하여 구할 수 있다."},{"code":"9수04-02","text":"자료를 줄기와 잎 그림, 도수분포표, 히스토그램, 도수분포다각형으로 나타내고 해석할 수 있다."},{"code":"9수04-03","text":"상대도수를 구하고, 상대도수의 분포를 표나 그래프로 나타내고 해석할 수 있다."},{"code":"9수04-04","text":"통계적 탐구 문제를 설정하고, 공학 도구를 이용하여 자료를 수집하여 분석하고, 그 결과를 해석할 수 있다."},{"code":"9수04-05","text":"경우의 수를 구할 수 있다."},{"code":"9수04-06","text":"확률의 개념과 그 기본 성질을 이해하고, 확률을 구할 수 있다."},{"code":"9수04-07","text":"분산과 표준편차를 구하고 자료의 분포를 설명할 수 있다."},{"code":"9수04-08","text":"공학 도구를 이용하여 자료를 상자그림으로 나타내고 분포를 비교할 수 있다."},{"code":"9수04-09","text":"자료를 산점도로 나타내고 상관관계를 말할 수 있다."},{"code":"10공수1-01-01","text":"다항식의 사칙연산의 원리를 설명하고, 그 계산을 할 수 있다."},{"code":"10공수1-01-02","text":"항등식의 성질과 나머지정리를 이해하고, 이를 활용하여 문제를 해결할 수 있다."},{"code":"10공수1-01-03","text":"다항식의 인수분해를 할 수 있다."},{"code":"10공수1-02-01","text":"복소수의 뜻과 성질을 설명하고, 사칙연산을 수행할 수 있다."},{"code":"10공수1-02-02","text":"이차방정식의 실근과 허근을 이해하고, 판별식을 이용하여 이차방정식의 근을 판별할 수 있다."},{"code":"10공수1-02-03","text":"이차방정식의 근과 계수의 관계를 설명할 수 있다."},{"code":"10공수1-02-04","text":"이차방정식과 이차함수를 연결하여 그 관계를 설명할 수 있다."},{"code":"10공수1-02-05","text":"이차함수의 그래프와 직선의 위치 관계를 판단할 수 있다."},{"code":"10공수1-02-06","text":"이차함수의 최대, 최소를 탐구하고, 이를 실생활과 연결하여 유용성을 인식할 수 있다."},{"code":"10공수1-02-07","text":"간단한 삼차방정식과 사차방정식을 풀 수 있다."},{"code":"10공수1-02-08","text":"미지수가 2개인 연립이차방정식을 풀 수 있다."},{"code":"10공수1-02-09","text":"미지수가 1개인 연립일차부등식을 풀 수 있다."},{"code":"10공수1-02-10","text":"절댓값을 포함한 일차부등식을 풀 수 있다."},{"code":"10공수1-02-11","text":"이차부등식과 이차함수를 연결하여 그 관계를 설명하고, 이차부등식과 연립이차 부등식을 풀 수 있다."},{"code":"10공수1-03-01","text":"합의 법칙과 곱의 법칙을 이해하고, 적절한 전략을 사용하여 경우의 수와 관련된 문제를 해결할 수 있다."},{"code":"10공수1-03-02","text":"순열의 개념을 이해하고, 순열의 수를 구하는 방법을 설명할 수 있다."},{"code":"10공수1-03-03","text":"조합의 개념을 이해하고, 조합의 수를 구하는 방법을 설명할 수 있다."},{"code":"10공수1-04-01","text":"행렬의 뜻을 알고, 실생활 상황을 행렬로 표현할 수 있다."},{"code":"10공수1-04-02","text":"행렬의 연산을 수행하고, 관련된 문제를 해결할 수 있다."},{"code":"10공수2-01-01","text":"선분의 내분을 이해하고, 내분점의 좌표를 계산할 수 있다."},{"code":"10공수2-01-02","text":"두 직선의 평행 조건과 수직 조건을 탐구하고 이해한다."},{"code":"10공수2-01-03","text":"점과 직선 사이의 거리를 구하고, 관련된 문제를 해결할 수 있다."},{"code":"10공수2-01-04","text":"원의 방정식을 구하고, 그래프를 그릴 수 있다."},{"code":"10공수2-01-05","text":"좌표평면에서 원과 직선의 위치 관계를 판단하고, 이를 활용하여 문제를 해결할 수 있다."},{"code":"10공수2-01-06","text":"평행이동을 탐구하고, 실생활과 연결하여 문제를 해결할 수 있다."},{"code":"10공수2-01-07","text":"원점, 축, 축, 직선   에 대한 대칭이동을 탐구하고, 실생활과 연결하여 문제를 해결할 수 있다."},{"code":"10공수2-02-01","text":"집합의 개념을 이해하고, 집합을 표현할 수 있다."},{"code":"10공수2-02-02","text":"두 집합 사이의 포함관계를 판단할 수 있다."},{"code":"10공수2-02-03","text":"집합의 연산을 수행하고, 벤 다이어그램을 이용하여 나타낼 수 있다."},{"code":"10공수2-02-04","text":"명제와 조건의 뜻을 알고, ‘모든’, ‘어떤’을 포함한 명제를 이해하고 설명할 수 있다."},{"code":"10공수2-02-05","text":"명제의 역과 대우를 이해하고 설명할 수 있다."},{"code":"10공수2-02-06","text":"충분조건과 필요조건을 이해하고 판단할 수 있다."},{"code":"10공수2-02-07","text":"대우를 이용한 증명법과 귀류법을 이해하고 관련된 명제를 증명할 수 있다."},{"code":"10공수2-02-08","text":"절대부등식의 뜻을 알고, 간단한 절대부등식을 증명할 수 있다."},{"code":"10공수2-03-01","text":"함수의 개념을 설명하고, 그 그래프를 이해한다."},{"code":"10공수2-03-02","text":"함수의 합성을 설명하고, 합성함수를 구할 수 있다."},{"code":"10공수2-03-03","text":"역함수의 개념을 설명하고, 역함수를 구할 수 있다."},{"code":"10공수2-03-04","text":"유리함수    의 그래프를 그릴 수 있고, 그 그래프의 성질을 탐구할 수    있다."},{"code":"10공수2-03-05","text":"무리함수        의 그래프를 그릴 수 있고, 그 그래프의 성질을 탐구할 수 있다."},{"code":"10기수1-01-01","text":"다항식의 덧셈과 뺄셈의 원리를 이해하고, 그 계산을 할 수 있다."},{"code":"10기수1-01-02","text":"다항식의 곱셈과 나눗셈의 원리를 이해하고, 그 계산을 할 수 있다."},{"code":"10기수1-01-03","text":"인수분해 공식을 이용하여 다항식의 인수분해를 할 수 있다."},{"code":"10기수1-02-01","text":"간단한 이차방정식을 풀 수 있다."},{"code":"10기수1-02-02","text":"이차방정식에서 판별식을 이해하고, 근의 존재성을 판단할 수 있다."},{"code":"10기수1-02-03","text":"이차함수의 뜻을 알고, 이차함수의 그래프의 성질을 설명할 수 있다."},{"code":"10기수1-02-04","text":"이차방정식과 이차함수를 연결하여 그 관계를 이해한다."},{"code":"10기수1-02-05","text":"이차함수의 최대, 최소를 이해하고, 간단한 문제를 해결할 수 있다."},{"code":"10기수1-02-06","text":"부등식의 성질을 설명하고, 일차부등식을 풀 수 있다."},{"code":"10기수1-02-07","text":"미지수가 1개인 연립일차부등식을 풀 수 있다."},{"code":"10기수1-02-08","text":"절댓값을 포함한 간단한 일차부등식을 풀 수 있다."},{"code":"10기수1-02-09","text":"이차부등식과 이차함수를 연결하여 그 관계를 이해하고, 간단한 이차부등식을 풀 수 있다."},{"code":"10기수1-03-01","text":"합의 법칙과 곱의 법칙을 이해하고, 적절한 전략을 사용하여 경우의 수와 관련된 문제를 해결할 수 있다."},{"code":"10기수1-03-02","text":"순열의 개념을 이해하고, 순열의 수를 구할 수 있다."},{"code":"10기수1-03-03","text":"조합의 개념을 이해하고, 조합의 수를 구할 수 있다."},{"code":"10기수1-04-01","text":"행렬의 뜻을 알고, 실생활 상황을 행렬로 표현할 수 있다."},{"code":"10기수1-04-02","text":"행렬의 연산을 수행하고, 간단한 문제를 해결할 수 있다."},{"code":"10기수2-01-01","text":"두 점 사이의 거리를 계산할 수 있다."},{"code":"10기수2-01-02","text":"직선의 방정식을 구하고, 그래프를 그릴 수 있다."},{"code":"10기수2-01-03","text":"두 직선의 평행 조건과 수직 조건을 이해하고, 관련된 문제를 해결할 수 있다."},{"code":"10기수2-01-04","text":"원의 방정식을 구하고, 그래프를 그릴 수 있다."},{"code":"10기수2-01-05","text":"좌표평면에서 원과 직선의 위치 관계를 판단할 수 있다."},{"code":"10기수2-01-06","text":"평행이동을 이해하고, 실생활과 연결할 수 있다."},{"code":"10기수2-01-07","text":"원점, 축, 축, 직선   에 대한 대칭이동을 이해하고, 실생활과 연결할 수 있다."},{"code":"10기수2-02-01","text":"집합의 개념을 이해하고, 집합을 표현할 수 있다."},{"code":"10기수2-02-02","text":"두 집합 사이의 포함관계를 판단할 수 있다."},{"code":"10기수2-02-03","text":"두 집합의 연산을 수행하고, 벤 다이어그램을 이용하여 나타낼 수 있다."},{"code":"10기수2-02-04","text":"명제와 조건의 뜻을 알고, 이를 설명할 수 있다."},{"code":"10기수2-02-05","text":"명제의 역과 대우를 이해하고 설명할 수 있다."},{"code":"10기수2-03-01","text":"함수의 개념을 설명하고, 그 그래프를 이해한다."},{"code":"10기수2-03-02","text":"함수의 합성을 이해하고, 합성함수를 구할 수 있다."},{"code":"10기수2-03-03","text":"역함수의 개념을 이해하고, 역함수를 구할 수 있다."},{"code":"10기수2-03-04","text":"유리함수    의 그래프를 그릴 수 있고, 그 그래프의 성질을 탐구할 수 있다."},{"code":"10기수2-03-05","text":"무리함수    "},{"code":"12대수01-01","text":"거듭제곱과 거듭제곱근의 뜻을 알고, 그 성질을 이용하여 계산할 수 있다."},{"code":"12대수01-02","text":"지수가 유리수, 실수까지 확장될 수 있음을 이해하고, 이를 설명할 수 있다."},{"code":"12대수01-03","text":"지수법칙을 이해하고, 이를 이용하여 식을 간단히 나타낼 수 있다."},{"code":"12대수01-04","text":"로그의 뜻을 알고, 그 성질을 이용하여 계산할 수 있다."},{"code":"12대수01-05","text":"상용로그를 이해하고, 이를 실생활과 연결하여 문제를 해결할 수 있다."},{"code":"12대수01-06","text":"지수함수와 로그함수의 뜻을 알고, 이를 설명할 수 있다."},{"code":"12대수01-07","text":"지수함수와 로그함수의 그래프를 그릴 수 있고, 그 성질을 설명할 수 있다."},{"code":"12대수01-08","text":"지수함수, 로그함수를 활용하여 문제를 해결할 수 있다."},{"code":"12대수02-01","text":"일반각과 호도법의 뜻을 알고, 그 관계를 설명할 수 있다."},{"code":"12대수02-02","text":"삼각함수의 개념을 이해하여 사인함수, 코사인함수, 탄젠트함수의 그래프를 그리고, 그 성질을 설명할 수 있다."},{"code":"12대수02-03","text":"사인법칙과 코사인법칙을 이해하고, 실생활 문제를 해결할 수 있다."},{"code":"12대수03-01","text":"수열의 뜻을 설명할 수 있다."},{"code":"12대수03-02","text":"등차수열의 뜻을 알고, 일반항, 첫째항부터 제항까지의 합을 구할 수 있다."},{"code":"12대수03-03","text":"등비수열의 뜻을 알고, 일반항, 첫째항부터 제항까지의 합을 구할 수 있다."},{"code":"12대수03-04","text":"∑ 의 뜻과 성질을 이해하고, 이를 활용하여 문제를 해결할 수 있다."},{"code":"12대수03-05","text":"여러 가지 수열의 첫째항부터 제항까지의 합을 구하는 방법을 설명할 수 있다."},{"code":"12대수03-06","text":"수열의 귀납적 정의를 설명할 수 있다."},{"code":"12대수03-07","text":"수학적 귀납법의 원리를 이해하고, 이를 이용하여 명제를 증명할 수 있다."},{"code":"12미적Ⅰ-01-01","text":"함수의 극한의 뜻을 알고, 이를 설명할 수 있다."},{"code":"12미적Ⅰ-01-02","text":"함수의 극한에 대한 성질을 이해하고, 함수의 극한값을 구할 수 있다."},{"code":"12미적Ⅰ-01-03","text":"함수의 연속을 극한으로 탐구하고 이해한다."},{"code":"12미적Ⅰ-01-04","text":"연속함수의 성질을 이해하고, 이를 활용하여 문제를 해결할 수 있다."},{"code":"12미적Ⅰ-02-01","text":"미분계수를 이해하고, 이를 구할 수 있다."},{"code":"12미적Ⅰ-02-02","text":"함수의 미분가능성과 연속성의 관계를 설명하고, 이를 활용할 수 있다."},{"code":"12미적Ⅰ-02-03","text":"함수    ( 은 양의 정수)의 도함수를 구할 수 있다."},{"code":"12미적Ⅰ-02-04","text":"함수의 실수배, 합, 차, 곱의 미분법을 알고, 다항함수의 도함수를 구할 수 있다."},{"code":"12미적Ⅰ-02-05","text":"미분계수와 접선의 기울기의 관계를 이해하고, 접선의 방정식을 구할 수 있다."},{"code":"12미적Ⅰ-02-06","text":"함수에 대한 평균값 정리를 설명하고, 이를 활용할 수 있다."},{"code":"12미적Ⅰ-02-07","text":"함수의 증가와 감소, 극대와 극소를 판정하고 설명할 수 있다."},{"code":"12미적Ⅰ-02-08","text":"함수의 그래프의 개형을 그릴 수 있다."},{"code":"12미적Ⅰ-02-09","text":"방정식과 부등식에 대한 문제를 해결할 수 있다."},{"code":"12미적Ⅰ-02-10","text":"미분을 속도와 가속도에 대한 문제에 활용하고, 그 유용성을 인식할 수 있다."},{"code":"12미적Ⅰ-03-01","text":"부정적분의 뜻을 알고, 이를 설명할 수 있다."},{"code":"12미적Ⅰ-03-02","text":"함수의 실수배, 합, 차의 부정적분을 알고, 다항함수의 부정적분을 구할 수 있다."},{"code":"12미적Ⅰ-03-03","text":"정적분의 개념을 탐구하고, 그 성질을 이해한다."},{"code":"12미적Ⅰ-03-04","text":"부정적분과 정적분의 관계를 이해하고, 다항함수의 정적분을 구할 수 있다."},{"code":"12미적Ⅰ-03-05","text":"곡선으로 둘러싸인 도형의 넓이에 대한 문제를 해결할 수 있다."},{"code":"12미적Ⅰ-03-06","text":"적분을 속도와 거리에 대한 문제에 활용하고, 그 유용성을 인식할 수 있다."},{"code":"12확통01-01","text":"중복순열, 같은 것이 있는 순열을 이해하고, 그 순열의 수를 구하는 방법을 설명할 수 있다."},{"code":"12확통01-02","text":"중복조합을 이해하고, 중복조합의 수를 구하는 방법을 설명할 수 있다."},{"code":"12확통01-03","text":"이항정리를 이해하고, 이를 활용하여 문제를 해결할 수 있다."},{"code":"12확통02-01","text":"확률의 개념을 이해하고 기본 성질을 설명할 수 있다."},{"code":"12확통02-02","text":"확률의 덧셈정리를 이해하고, 이를 활용하여 문제를 해결할 수 있다."},{"code":"12확통02-03","text":"여사건의 확률을 이해하고, 이를 활용하여 문제를 해결할 수 있다."},{"code":"12확통02-04","text":"조건부확률을 이해하고, 이를 실생활과 연결하여 문제를 해결할 수 있다."},{"code":"12확통02-05","text":"사건의 독립과 종속을 이해하고, 이를 판단할 수 있다."},{"code":"12확통02-06","text":"확률의 곱셈정리를 이해하고, 이를 활용하여 문제를 해결할 수 있다."},{"code":"12확통03-01","text":"확률변수와 확률분포의 뜻을 설명할 수 있다."},{"code":"12확통03-02","text":"이산확률변수의 기댓값(평균)과 표준편차를 구할 수 있다."},{"code":"12확통03-03","text":"이항분포의 뜻과 성질을 이해하고, 평균과 표준편차를 구할 수 있다."},{"code":"12확통03-04","text":"정규분포의 뜻과 성질을 이해하고, 이항분포와의 관계를 설명할 수 있다."},{"code":"12확통03-05","text":"모집단과 표본의 뜻을 알고, 표본추출의 방법을 설명할 수 있다."},{"code":"12확통03-06","text":"표본평균과 모평균, 표본비율과 모비율의 관계를 이해하고 설명할 수 있다."},{"code":"12확통03-07","text":"공학 도구를 이용하여 모평균 및 모비율을 추정하고 그 결과를 해석할 수 있다."},{"code":"12미적Ⅱ-01-01","text":"수열의 수렴, 발산의 뜻을 알고, 이를 판정할 수 있다."},{"code":"12미적Ⅱ-01-02","text":"수열의 극한에 대한 성질을 이해하고, 이를 활용하여 극한값을 구하는 방법을 설명할 수 있다."},{"code":"12미적Ⅱ-01-03","text":"등비수열의 수렴, 발산을 판정하고, 수렴하는 경우 그 극한값을 구할 수 있다."},{"code":"12미적Ⅱ-01-04","text":"급수의 수렴, 발산의 뜻을 알고, 이를 판정할 수 있다."},{"code":"12미적Ⅱ-01-05","text":"등비급수의 합을 구하고, 이를 활용할 수 있다."},{"code":"12미적Ⅱ-02-01","text":"지수함수와 로그함수의 극한을 구하고 미분할 수 있다."},{"code":"12미적Ⅱ-02-02","text":"삼각함수의 덧셈정리를 설명하고, 이를 활용할 수 있다."},{"code":"12미적Ⅱ-02-03","text":"삼각함수의 극한을 구하고, 사인함수와 코사인함수를 미분할 수 있다."},{"code":"12미적Ⅱ-02-04","text":"함수의 몫을 미분할 수 있다."},{"code":"12미적Ⅱ-02-05","text":"합성함수를 미분할 수 있다."},{"code":"12미적Ⅱ-02-06","text":"매개변수로 나타낸 함수를 미분할 수 있다."},{"code":"12미적Ⅱ-02-07","text":"음함수와 역함수를 미분할 수 있다."},{"code":"12미적Ⅱ-02-08","text":"다양한 곡선의 접선의 방정식을 구할 수 있다."},{"code":"12미적Ⅱ-02-09","text":"함수의 그래프의 개형을 그릴 수 있다."},{"code":"12미적Ⅱ-02-10","text":"방정식과 부등식에 대한 문제를 해결할 수 있다."},{"code":"12미적Ⅱ-02-11","text":"미분을 속도와 가속도에 대한 문제에 활용하고, 그 유용성을 인식할 수 있다."},{"code":"12미적Ⅱ-03-01","text":"   (  은 실수), 지수함수, 삼각함수의 부정적분과 정적분을 구할 수 있다."},{"code":"12미적Ⅱ-03-02","text":"치환적분법을 이해하고, 이를 활용할 수 있다."},{"code":"12미적Ⅱ-03-03","text":"부분적분법을 이해하고, 이를 활용할 수 있다."},{"code":"12미적Ⅱ-03-04","text":"정적분과 급수의 합 사이의 관계를 탐구하고 이해한다."},{"code":"12미적Ⅱ-03-05","text":"곡선으로 둘러싸인 도형의 넓이에 대한 문제를 해결할 수 있다."},{"code":"12미적Ⅱ-03-06","text":"입체도형의 부피에 대한 문제를 해결할 수 있다."},{"code":"12미적Ⅱ-03-07","text":"적분을 속도와 거리에 대한 문제에 활용하고, 그 유용성을 인식할 수 있다."},{"code":"12기하01-01","text":"포물선의 뜻을 알고, 포물선을 방정식으로 표현할 수 있다."},{"code":"12기하01-02","text":"타원의 뜻을 알고, 타원을 방정식으로 표현할 수 있다."},{"code":"12기하01-03","text":"쌍곡선의 뜻을 알고, 쌍곡선을 방정식으로 표현할 수 있다."},{"code":"12기하01-04","text":"이차곡선의 접선의 방정식을 구할 수 있다."},{"code":"12기하02-01","text":"직선과 직선, 직선과 평면, 평면과 평면의 위치 관계에 대한 간단한 증명을 할 수 있다."},{"code":"12기하02-02","text":"삼수선 정리를 이해하고, 이를 활용하여 문제를 해결할 수 있다."},{"code":"12기하02-03","text":"도형의 정사영의 뜻을 알고, 도형과 정사영의 관계를 탐구할 수 있다."},{"code":"12기하02-04","text":"좌표공간에서 두 점 사이의 거리와 선분의 내분점의 좌표를 구할 수 있다."},{"code":"12기하02-05","text":"구를 방정식으로 표현할 수 있다."},{"code":"12기하03-01","text":"벡터의 뜻을 알고, 벡터의 덧셈, 뺄셈, 실수배를 할 수 있다."},{"code":"12기하03-02","text":"위치벡터의 뜻을 알고, 벡터와 좌표를 대응시켜 표현할 수 있다."},{"code":"12기하03-03","text":"내적의 뜻을 알고, 두 벡터의 내적을 구할 수 있다."},{"code":"12기하03-04","text":"벡터를 이용하여 직선의 방정식을 구할 수 있다."},{"code":"12기하03-05","text":"좌표공간에서 벡터를 이용하여 평면의 방정식과 구의 방정식을 구할 수 있다."},{"code":"12경수01-01","text":"통계 자료를 활용하여 경제지표의 의미를 이해하고, 경제지표의 변화를 설명할 수 있다."},{"code":"12경수01-02","text":"환율과 관련된 실생활 문제를 해결할 수 있다."},{"code":"12경수01-03","text":"세금과 관련된 실생활 문제를 해결할 수 있다."},{"code":"12경수01-04","text":"단리와 복리를 이용하여 이자와 원리합계를 구하고, 미래에 받을 금액의 현재가치를 구할 수 있다."},{"code":"12경수01-05","text":"연금의 뜻을 알고, 연금의 현재가치를 구할 수 있다."},{"code":"12경수02-01","text":"여러 가지 경제 현상을 함수로 나타낼 수 있다."},{"code":"12경수02-02","text":"함수와 그래프를 활용하여 수요곡선과 공급곡선의 의미를 탐구하고 이해한다."},{"code":"12경수02-03","text":"효용의 의미를 이해하고, 효용을 함수와 그래프로 나타낼 수 있다."},{"code":"12경수02-04","text":"수요와 공급의 상호 작용에 의해 균형가격이 결정되는 경제 현상을 설명할 수 있다."},{"code":"12경수02-05","text":"세금과 소득의 변화가 균형가격에 미치는 영향을 탐구하고 이해한다."},{"code":"12경수02-06","text":"부등식의 영역의 개념을 이해하고, 이를 활용하여 경제 현상의 문제를 해결할 수 있다."},{"code":"12경수03-01","text":"여러 가지 경제 현상을 행렬로 나타내고, 연산할 수 있다."},{"code":"12경수03-02","text":"역행렬의 뜻을 알고,  ×  행렬의 역행렬을 구할 수 있다."},{"code":"12경수03-03","text":"행렬의 연산과 역행렬을 활용하여 경제 현상의 문제를 해결할 수 있다."},{"code":"12경수04-01","text":"미분의 개념을 이해하고 경제 현상을 나타내는 함수를 미분할 수 있다."},{"code":"12경수04-02","text":"미분을 이용하여 그래프의 개형을 탐구하고 해석할 수 있다."},{"code":"12경수04-03","text":"미분을 활용하여 탄력성의 의미를 탐구하고 이해한다."},{"code":"12경수04-04","text":"미분을 활용하여 경제 현상의 최적화 문제를 해결할 수 있다."},{"code":"12인수01-01","text":"인공지능의 개념을 이해하고 학습 방식을 수학적으로 해석할 수 있다."},{"code":"12인수01-02","text":"인공지능에서 수학을 활용한 역사적 사례를 탐구하고 설명할 수 있다."},{"code":"12인수01-03","text":"빅데이터의 개념과 특성을 알고 인공지능에서 빅데이터를 활용한 사례를 찾을 수 있다."},{"code":"12인수02-01","text":"집합과 벡터를 이용하여 텍스트 데이터를 목적에 맞게 표현할 수 있다."},{"code":"12인수02-02","text":"빈도수 벡터를 이용하여 텍스트 데이터를 요약하고 유용한 정보를 추출할 수 있다."},{"code":"12인수02-03","text":"인공지능이 텍스트를 특성에 따라 분석하는 수학적 방법을 설명할 수 있다."},{"code":"12인수03-01","text":"행렬을 이용하여 이미지 데이터를 목적에 맞게 표현할 수 있다."},{"code":"12인수03-02","text":"행렬의 연산을 이용하여 이미지 데이터를 다양하게 변환할 수 있다."},{"code":"12인수03-03","text":"인공지능이 이미지를 자동으로 분류하는 수학적 방법을 설명할 수 있다."},{"code":"12인수04-01","text":"데이터를 분석하여 사건이 일어날 확률을 구하고 이를 예측에 이용할 수 있다."},{"code":"12인수04-02","text":"공학 도구를 사용하여 데이터의 경향성을 추세선으로 나타내고 이를 예측에 이용할 수 있다."},{"code":"12인수04-03","text":"손실함수를 이해하고 최적화된 추세선을 찾을 수 있다."},{"code":"12인수04-04","text":"경사하강법을 이해하고 최적화된 예측을 위한 인공지능의 학습 방법을 설명할 수 있다."},{"code":"12인수05-01","text":"수학적 원리를 이용하여 인공지능이 실생활 문제를 합리적으로 해결하는 사례를 찾을 수 있다."},{"code":"12인수05-02","text":"인공지능과 관련된 수학 주제를 선정하여 탐구할 수 있다."},{"code":"12직수01-01","text":"직무 상황에서 수 개념과 사칙연산의 문제를 해결하고 그 유용성을 인식할 수 있다."},{"code":"12직수01-02","text":"큰 수를 어림하여 문제를 해결하고, 어림값을 이용하여 수의 크기를 비교할 수 있다."},{"code":"12직수01-03","text":"시간, 길이, 무게, 들이의 표준 단위를 알고, 단위를 환산할 수 있다."},{"code":"12직수02-01","text":"비의 개념을 직무 상황에 연결하여 적용할 수 있다."},{"code":"12직수02-02","text":"비율을 백분율로 표현할 수 있고 직무 상황에 연결하여 적용할 수 있다."},{"code":"12직수02-03","text":"두 양 사이의 대응 관계를 나타낸 표에서 규칙을 찾아 설명할 수 있다."},{"code":"12직수02-04","text":"증가와 감소, 주기적 변화 등의 관계를 나타내는 그래프를 설명할 수 있다."},{"code":"12직수02-05","text":"일차방정식 또는 일차부등식을 활용하여 직무 상황의 문제를 해결할 수 있다."},{"code":"12직수03-01","text":"입체도형의 겨냥도와 전개도를 그릴 수 있고, 겨냥도와 전개도를 이용하여 입체도형의 모양을 만들 수 있다."},{"code":"12직수03-02","text":"입체도형의 위, 앞, 옆에서 본 모양을 표현할 수 있고, 이러한 표현을 보고 입체 도형의 모양을 판별할 수 있다."},{"code":"12직수03-03","text":"도형의 이동, 합동과 닮음을 직무 상황에 연결하여 문제를 해결할 수 있다."},{"code":"12직수03-04","text":"직무 상황에서 나타나는 평면도형의 둘레와 넓이를 구할 수 있다."},{"code":"12직수03-05","text":"직무 상황에서 나타나는 입체도형의 겉넓이와 부피를 구할 수 있다."},{"code":"12직수04-01","text":"직무 상황에서 경우의 수를 구할 수 있다."},{"code":"12직수04-02","text":"어떤 현상이 나타날 가능성을 수치화하여 설명할 수 있다."},{"code":"12직수04-03","text":"직무 상황의 자료를 목적에 맞게 표와 그래프로 정리할 수 있다."},{"code":"12직수04-04","text":"직무 상황의 다양한 표와 그래프를 해석할 수 있다."},{"code":"12직수04-05","text":"다양한 자료의 특성을 파악하여, 직무 목적에 적합한 표나 그래프로 나타내고 합리적인 의사 결정을 할 수 있다."},{"code":"12수문01-01","text":"음악과 관련된 수학적 내용을 조사하고, 관련 활동을 수행할 수 있다."},{"code":"12수문01-02","text":"미술과 관련된 수학적 내용을 조사하고, 관련 활동을 수행할 수 있다."},{"code":"12수문01-03","text":"문학과 관련된 수학적 내용을 조사하고, 관련 활동을 수행할 수 있다."},{"code":"12수문01-04","text":"영화와 관련된 수학적 내용을 조사하고, 관련 활동을 수행할 수 있다."},{"code":"12수문02-01","text":"스포츠와 관련된 수학적 내용을 조사하여 그 유용성을 인식할 수 있다."},{"code":"12수문02-02","text":"게임과 관련된 수학적 내용을 조사하고 관련 활동을 수행할 수 있다."},{"code":"12수문02-03","text":"디지털 기술에 활용된 수학적 내용을 조사하여 설명할 수 있다."},{"code":"12수문02-04","text":"투표와 관련된 수학적 내용을 조사하고 이를 활용하여 합리적 의사 결정을 위한 방법을 제안할 수 있다."},{"code":"12수문03-01","text":"민속 수학과 건축 양식 속에 나타난 수학적 원리에 대해 탐구하고 문화 다양성을 이해한다."},{"code":"12수문03-02","text":"점자표에 사용된 수학적 원리에 대해 탐구하고 이를 활용하여 산출물을 설계할 수 있다."},{"code":"12수문03-03","text":"대중매체로부터 얻은 데이터를 정리, 분석하여 그 의미와 가치를 해석할 수 있다."},{"code":"12수문03-04","text":"가치소비를 위한 의사 결정 방법을 탐구하고 실천 방법을 제시할 수 있다."},{"code":"12수문04-01","text":"식생활과 관련된 문제를 수학적으로 분석하고 이를 개선하기 위한 방법을 제안할 수 있다."},{"code":"12수문04-02","text":"대기 오염과 관련된 문제를 수학적으로 분석하고 이를 개선하기 위한 방법을 제안할 수 있다."},{"code":"12수문04-03","text":"사막화 현상과 관련된 문제를 수학적으로 분석하고 이를 개선하기 위한 방법을 제안 할 수 있다."},{"code":"12수문04-04","text":"생물 다양성과 생명권 관련 자료를 수학적으로 분석하고 이를 통해 생태 감수성을 함양할 수 있다."},{"code":"12실통01-01","text":"통계와 통계적 방법의 유용성과 필요성을 인식할 수 있다."},{"code":"12실통01-02","text":"통계적 문제해결 과정을 이해하고 각 단계의 역할을 설명할 수 있다."},{"code":"12실통01-03","text":"모집단과 표본의 뜻을 알고, 표본추출의 방법을 이해하여 문제 상황에 맞는 방법을 선택할 수 있다."},{"code":"12실통02-01","text":"자료의 종류를 알고 설명할 수 있다."},{"code":"12실통02-02","text":"자료의 수집 방법을 이해하고 문제 상황에 맞는 자료 수집 방법을 선택할 수 있다."},{"code":"12실통02-03","text":"그래프의 종류를 알고 자료의 특성을 나타내는 적절한 그래프를 그릴 수 있다."},{"code":"12실통02-04","text":"대푯값과 산포도의 종류를 알고 자료의 특성을 나타내는 값으로 요약할 수 있다."},{"code":"12실통03-01","text":"정규분포와 t분포를 공학 도구를 이용하여 탐구할 수 있다."},{"code":"12실통03-02","text":"실생활에서 공학 도구를 이용하여 모평균을 추정할 수 있다."},{"code":"12실통03-03","text":"실생활에서 공학 도구를 이용하여 모비율을 추정할 수 있다."},{"code":"12실통03-04","text":"가설검정을 이해하고, 실생활에서 공학 도구를 이용하여 가설을 검정할 수 있다."},{"code":"12실통04-01","text":"실생활에서 통계적 탐구 과정에 따라 문제를 해결하고 합리적인 의사 결정을 할 수 있다."},{"code":"12실통04-02","text":"통계적 탐구 과정과 그 결과를 비판적으로 성찰할 수 있다."},{"code":"12수과01-01","text         } else {
          item.style({
            "background-color": successorColor,
            "color": fontColor,
            "label": item.data("label"),
            "opacity": 1,
            "z-index": getMaxZIndex(),
          });
        }
      });

      node.predecessors().forEach((item) => {
        if (item.isEdge()) {
          item.style({
            "width": edgeActiveWidth,
            "arrow-scale": arrowActiveScale,
            "line-color": predecessorColor,
            "target-arrow-color": predecessorColor,
            "opacity": 1,
            "z-index": getMaxZIndex(),
          });
        } else {
          item.style({
            "background-color": predecessorColor,
            "color": fontColor,
            "label": item.data("label"),
            "opacity": 1,
            "z-index": getMaxZIndex(),
          });
        }
      });

      node.neighborhood().forEach((item) => {
        const currentBg = item.style("background-color");
        const currentLine = item.style("line-color");
        item.style({
          "background-color": tinycolor(currentBg).darken(18).toString(),
          "line-color": tinycolor(currentLine).darken(18).toString(),
          "target-arrow-color": tinycolor(currentLine).darken(18).toString(),
        });
      });
      const focusCandidates = node.union(node.successors("node")).union(node.predecessors("node"));
      applyFocusedLabelCollision(node, focusCandidates);
      renderSelection(node.id());
      computeLabelOverlapReport();
    }

    function boxesOverlap(a, b) {
      return a.x1 < b.x2 && a.x2 > b.x1 && a.y1 < b.y2 && a.y2 > b.y1;
    }

    function estimateTextWidth(text, fontSize) {
      return Array.from(text).reduce((total, char) => {
        if (/[ㄱ-힝]/.test(char)) return total + fontSize;
        if (/[0-9A-Za-z]/.test(char)) return total + fontSize * 0.56;
        if (char === " ") return total + fontSize * 0.34;
        return total + fontSize * 0.72;
      }, 0);
    }

    function labelBox(node) {
      const label = node.style("label");
      if (!label) return null;
      const zoom = cy.zoom();
      const fontSize = Number(node.data("fontSize")) * zoom;
      const maxWidth = 86 * zoom;
      const width = Math.min(maxWidth, estimateTextWidth(label, fontSize)) + 8;
      const lines = Math.max(1, Math.ceil(estimateTextWidth(label, fontSize) / maxWidth));
      const height = (lines * fontSize * 1.2) + 5;
      const position = node.renderedPosition();
      const nodeHeight = Number(node.data("size")) * zoom;
      return {
        id: node.id(),
        x1: position.x - width / 2 - 2,
        x2: position.x + width / 2 + 2,
        y1: position.y - nodeHeight / 2 - height - 2,
        y2: position.y - nodeHeight / 2 + 6,
      };
    }

    function applyNonOverlappingLabels() {
      cy.nodes(":visible").forEach((node) => {
        node.style("label", node.data("label"));
        node.data("baseLabelVisible", false);
        node.data("focusLabelVisible", false);
      });
      const accepted = [];
      const sorted = cy.nodes(":visible").sort((a, b) => {
        return b.data("indegree") - a.data("indegree") ||
          b.data("outdegree") - a.data("outdegree") ||
          a.data("label").localeCompare(b.data("label"), "ko");
      });
      sorted.forEach((node) => {
        const box = labelBox(node);
        if (!box || accepted.some((acceptedBox) => boxesOverlap(box, acceptedBox))) {
          node.style("label", "");
        } else {
          node.data("baseLabelVisible", true);
          accepted.push(box);
        }
      });
      labelsReady = true;
      document.body.dataset.visibleLabelCount = String(accepted.length);
      return accepted.length;
    }

    function applyFocusedLabelCollision(centerNode, candidates) {
      cy.nodes().forEach((node) => node.data("focusLabelVisible", false));
      const accepted = [];
      const sorted = candidates.sort((a, b) => {
        if (a.id() === centerNode.id()) return -1;
        if (b.id() === centerNode.id()) return 1;
        return b.data("indegree") - a.data("indegree") ||
          b.data("outdegree") - a.data("outdegree") ||
          a.data("label").localeCompare(b.data("label"), "ko");
      });
      sorted.forEach((node) => {
        node.data("focusLabelVisible", false);
        node.style("label", node.data("label"));
        const box = labelBox(node);
        if (!box || accepted.some((acceptedBox) => boxesOverlap(box, acceptedBox))) {
          node.style("label", "");
        } else {
          node.data("focusLabelVisible", true);
          accepted.push(box);
        }
      });
      document.body.dataset.visibleLabelCount = String(accepted.length);
      return accepted.length;
    }

    function renderSelection(id) {
      const item = nodeMap.get(id);
      const deps = item.dependencies || [];
      const next = dependents.get(id) || [];
      const selection = document.getElementById("selection");
      selection.innerHTML = [
        "<h2>" + item.label + "</h2>",
        "<p><strong>영역</strong>: " + item.domain + " · <strong>학교급/과목군</strong>: " + item.stage + "</p>",
        "<p><strong>진입차수</strong>: " + item.indegree + " · <strong>의존 개념 수</strong>: " + item.outdegree + "</p>",
        "<p><strong>선수 개념</strong></p>",
        "<ul>" + (deps.length ? deps.map((dep) => "<li>" + dep + "</li>").join("") : "<li>없음</li>") + "</ul>",
        "<p><strong>후속 개념</strong></p>",
        "<ul>" + (next.length ? next.sort((a, b) => a.localeCompare(b, "ko")).map((dep) => "<li>" + dep + "</li>").join("") : "<li>없음</li>") + "</ul>",
      ].join("");
      selection.classList.add("open");
    }

    cy.on("mouseover tapstart", "node", (event) => {
      focusNode(event.target);
    });

    cy.on("mouseout tapend", "node", () => {
      if (!window.__pinnedNode) {
        resetStyles();
        computeLabelOverlapReport();
      }
    });

    cy.on("tap", "node", (event) => {
      window.__pinnedNode = event.target.id();
      focusNode(event.target);
    });

    cy.on("tap", (event) => {
      if (event.cy === event.target) {
        window.__pinnedNode = "";
        resetStyles();
        computeLabelOverlapReport();
      }
    });

    function applySearch() {
      const query = document.getElementById("searchInput").value.trim().toLowerCase();
      const domain = document.getElementById("domainSelect").value;
      const matchedIds = [];
      cy.nodes().forEach((node) => {
        const matchesQuery = !query || node.data("label").toLowerCase().includes(query);
        const matchesDomain = !domain || node.data("domain") === domain;
        const visible = matchesQuery && matchesDomain;
        node.style("display", visible ? "element" : "none");
        if (visible) matchedIds.push(node.id());
      });
      cy.edges().forEach((edge) => {
        const visible = edge.source().style("display") !== "none" && edge.target().style("display") !== "none";
        edge.style("display", visible ? "element" : "none");
      });
      if (matchedIds.length && matchedIds.length < GRAPH.stats.concepts) {
        cy.fit(cy.collection(matchedIds.map((id) => cy.getElementById(id))), 70);
      } else {
        setInitialView();
      }
      applyNonOverlappingLabels();
      resetStyles();
      computeLabelOverlapReport();
    }

    const domainSelect = document.getElementById("domainSelect");
    domainSelect.innerHTML = '<option value="">전체 영역</option>' + GRAPH.domains.map((domain) => '<option value="' + domain + '">' + domain + '</option>').join("");
    document.getElementById("searchInput").addEventListener("input", applySearch);
    domainSelect.addEventListener("change", applySearch);
    document.getElementById("fitButton").addEventListener("click", () => {
      cy.fit(undefined, 35);
      applyNonOverlappingLabels();
      resetStyles();
      computeLabelOverlapReport();
    });
    document.getElementById("resetButton").addEventListener("click", () => {
      document.getElementById("searchInput").value = "";
      domainSelect.value = "";
      window.__pinnedNode = "";
      cy.elements().style("display", "element");
      setInitialView();
      applyNonOverlappingLabels();
      resetStyles();
      computeLabelOverlapReport();
    });
    document.getElementById("hudToggle").addEventListener("click", () => {
      const hud = document.getElementById("hud");
      hud.classList.toggle("compact");
      document.getElementById("hudToggle").textContent = hud.classList.contains("compact") ? "+" : "-";
    });

    const drawer = document.getElementById("drawer");
    const drawerTitle = document.getElementById("drawerTitle");
    const drawerBody = document.getElementById("drawerBody");
    document.getElementById("listButton").addEventListener("click", () => {
      drawerTitle.textContent = "인접 리스트";
      drawerBody.innerHTML = "<pre></pre>";
      drawerBody.querySelector("pre").textContent = ADJACENCY_TEXT;
      drawer.classList.add("open");
    });
    document.getElementById("sourceButton").addEventListener("click", () => {
      drawerTitle.textContent = "원문과 범위";
      drawerBody.innerHTML = [
        "<p><strong>공식 원문</strong>: " + GRAPH.source.title + "</p>",
        "<p><strong>로컬 원문</strong>: " + GRAPH.source.pdf + "</p>",
        "<p><strong>성취기준</strong>: " + GRAPH.stats.standards.toLocaleString("ko-KR") + "개</p>",
        "<p><strong>표현 범위</strong>: 초등학교, 중학교, 고등학교 수학과 교육과정 전체 성취기준에서 추출한 개념어를 선수학습 의존 관계로 모델링했습니다.</p>",
        "<p>seomal.org와 같은 Cytoscape 캔버스 기반 힘 배치 그래프이며, 노드 크기는 PageRank가 아니라 요청 조건에 맞춰 진입차수에 비례하도록 조정했습니다.</p>",
      ].join("");
      drawer.classList.add("open");
    });
    document.getElementById("drawerClose").addEventListener("click", () => drawer.classList.remove("open"));

    function focusFromUrl() {
      const params = new URLSearchParams(location.search);
      const id = params.get("i");
      if (!id) return;
      const node = cy.getElementById(id);
      if (node && node.length) {
        focusNode(node);
        cy.center(node);
        cy.zoom({ level: Math.max(cy.zoom(), 1.1), renderedPosition: { x: window.innerWidth / 2, y: window.innerHeight / 2 } });
      }
    }

    function setInitialView() {
      cy.center();
      const fitted = cy.zoom();
      const target = Math.max(fitted, Math.min(0.38, Math.max(0.22, fitted * 2.8)));
      cy.zoom({
        level: target,
        renderedPosition: { x: window.innerWidth / 2, y: window.innerHeight / 2 },
      });
      document.body.dataset.cyZoom = String(cy.zoom());
    }

    function computeLabelOverlapReport() {
      const isFocused = Boolean(window.__focusedMode);
      const boxes = cy.nodes(":visible")
        .filter((node) => isFocused ? node.data("focusLabelVisible") : node.data("baseLabelVisible"))
        .map((node) => labelBox(node))
        .filter(Boolean);
      let count = 0;
      const examples = [];
      for (let i = 0; i < boxes.length; i += 1) {
        for (let j = i + 1; j < boxes.length; j += 1) {
          const a = boxes[i];
          const b = boxes[j];
          if (a.x1 < b.x2 && a.x2 > b.x1 && a.y1 < b.y2 && a.y2 > b.y1) {
            count += 1;
            if (examples.length < 20) examples.push([a.id, b.id]);
          }
        }
      }
      window.labelOverlapReport = { count, examples };
      document.body.dataset.labelOverlapCount = String(count);
      document.body.dataset.labelOverlapExamples = JSON.stringify(examples);
      return window.labelOverlapReport;
    }

    cy.ready(() => {
      resetStyles();
      setInitialView();
      setTimeout(() => {
        applyNonOverlappingLabels();
        resetStyles();
        focusFromUrl();
        computeLabelOverlapReport();
      }, 100);
    });

    cy.on("layoutstop", () => {
      setInitialView();
      setTimeout(() => {
        applyNonOverlappingLabels();
        resetStyles();
        computeLabelOverlapReport();
      }, 60);
    });

    window.addEventListener("resize", () => {
      setInitialView();
      setTimeout(() => {
        applyNonOverlappingLabels();
        resetStyles();
        computeLabelOverlapReport();
      }, 80);
    });
  </script>
</body>
</html>
